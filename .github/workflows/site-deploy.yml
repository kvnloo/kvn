name: Publish public kvn chat
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "site/**"
      - "content/**"
      - "scripts/**"
      - "*.md"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kvn-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.KVN_CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public site
        run: npm run test:site
      - name: Deploy to Cloudflare Worker
        run: npm run deploy:site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live deployment (when URL configured)
        if: vars.KVN_SITE_URL != ''
        run: npm run smoke:site -- "$KVN_SITE_URL"
        env:
          KVN_SITE_URL: ${{ vars.KVN_SITE_URL }}
